[package]
name = "speakers"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = "=2.0.0-rc.13"
hound = "3.5"
libc = "0.2"
sha2 = "0.10"
rustfft = "6"

[build-dependencies]
cmake = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-core-ml = "0.3.2"
metal = "0.32"
half = "2.7"
objc = "0.2"

[[bin]]
name = "heimdall-ax-probe"
path = "src/bin/heimdall-ax-probe.rs"

[[bin]]
name = "heimdall-speakers-file"
path = "src/bin/heimdall-speakers-file.rs"
