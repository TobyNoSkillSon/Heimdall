[package]
name = "speakers"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = "=2.0.0-rc.13"
hound = "3.5"
libc = "0.2"
sha2 = "0.10"

[build-dependencies]
cmake = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
# The GPU fault recovery shared with speak (`speak/src/gpu_recovery.rs`).
metal = "0.32"
objc = "0.2"
