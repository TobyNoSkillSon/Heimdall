[package]
name = "decide"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
libloading = "0.8"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
half = "2"


[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.32"
objc = "0.2"
