[package]
name = "heimdall-update"
version.workspace = true
edition.workspace = true
license.workspace = true

# Heimdall Alpha's in-app updater (docs/updates.md): release discovery, signed checksums, bundle and code-signature
# checks, staging, and the swap with one rollback, run by `heimdall-install-tool` after the app quits.
[lib]
name = "heimdall_update"
path = "src/lib.rs"

[[bin]]
name = "heimdall-install-tool"
path = "src/bin/install_tool.rs"

[[bin]]
name = "heimdall-update-sign"
path = "src/bin/sign.rs"

[features]
# Lets HEIMDALL_UPDATE_BASE be a file:// folder outside tests (a VM run against a locally packaged release). Release
# bundles never enable it.
local-releases = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "3"
base64 = "0.22"
getrandom = "0.4"
plist = "1"
libc = "0.2"
# Same client and features the app already uses; HTTPS only (rustls), no cookies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.39", features = ["bundled", "backup", "hooks"] }
