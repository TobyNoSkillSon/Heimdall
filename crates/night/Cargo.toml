[package]
name = "heimdall-night"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
heimdall-home = { path = "../home" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
heimdall-archive = { path = "../archive" }
listen = { path = "../listen" }
speakers = { path = "../speakers" }
ort = "=2.0.0-rc.13"
rusqlite = { version = "0.39", features = ["bundled"] }
hound = "3.5"
tempfile = "3"
libc = "0.2"
sha2 = "0.10"
zstd = "0.13"

[[bin]]
name = "heimdall-night"
path = "src/main.rs"
