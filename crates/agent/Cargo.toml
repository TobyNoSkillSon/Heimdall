[package]
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
# The public edition (app's `public` feature, docs/editions.md): personal-edition tools and features compiled out.
# The prompt is the same general text in both editions; what one user has comes from their data folder at runtime.
public = ["heimdall-emergency/public", "keychain/public"]
[dependencies]
heimdall-home = { path = "../home" }
# An ask option's grant is checked as the deny-list hook keeps it (`heimdall_emergency::grants`).
heimdall-emergency = { path = "../emergency-cli" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "net", "fs"] }
async-trait = "0.1"
rusqlite = { version = "0.39", features = ["bundled"] }
axum = "0.8"
http-body = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tempfile = "3"

sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Every secret through one door (crates/keychain): never a prompt, never a wait on the caller.
keychain = { path = "../keychain" }
url = "2"
