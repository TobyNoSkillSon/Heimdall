[package]
name = "t3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Heimdall's outside-client T3 Code control: pairing, worker threads, orchestrator pass-through, wakes."

[features]
# The public edition (app's `public` feature, docs/editions.md): its own Keychain name for the T3 pairing.
public = []

[dependencies]
# Delivery permits and the action ledger are shared runtime objects owned by the agent harness.
agent = { path = "../agent" }
anyhow = "1"
# The approval hook's launch record (`heimdall_emergency::approvals`): a digest of each thread Heimdall launches.
heimdall-emergency = { path = "../emergency-cli" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "net", "fs"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
