[package]
name = "app"
default-run = "heimdall"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "heimdall"
path = "src/main.rs"

[features]
default = []
# The public edition (`scripts/bundle.sh --edition public`, the release default; docs/editions.md): Phonon S is the only
# built-in voice and nothing of the user's ships. Without it the build is the user's personal edition (Drama 3 with Jarvis),
# which is also what plain `cargo build` and `cargo test` give.
public = ["agent/public", "listen/public", "t3/public", "ui/public"]
# The old-vs-new timeline_search comparison harness (src/mcp_timeline_live.rs), which compiles lab/timeline-diet/.
lab-timeline = []

[dependencies]
heimdall-home = { path = "../home" }
# In-app updates, public edition only (updates.rs, docs/updates.md).
heimdall-update = { path = "../update" }
heimdall-archive = { path = "../archive" }
anyhow = "1"
base64 = "0.22"
agent = { path = "../agent" }
t3 = { path = "../t3" }
capture = { path = "../capture" }
listen = { path = "../listen" }
heimdall-night = { path = "../night" }
speakers = { path = "../speakers" }
decide = { path = "../decide" }
screen = { path = "../screen", features = ["listen-adapter"] }
speak = { path = "../speak" }
voicebank = { path = "../voicebank" }
ui = { path = "../ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled", "hooks"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1"
crossbeam-channel = "0.5"
libc = "0.2"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hound = "3.5"
rubato = "0.16"
uuid = { version = "1", features = ["v4"] }
# Plan refresher (plan_refresher.rs): the Anthropic Messages API, same client and features as the agent crate.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# ElevenLabs key in the login Keychain (speech_voice.rs), like the agent providers' keys.
security-framework = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Engine models (inference_engine/models.rs): the refs/splash pin folder name, as Splash computes it.
sha2 = "0.10"

# The harness check at each start (harness_autonomy.rs) and emergency mode's tests.
heimdall-emergency = { path = "../emergency-cli" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Wake sound (bridge/speech_policy.rs): macOS's Tink through NSSound on the main queue.
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
dispatch2 = { workspace = true }
# Vella's dictation notifications (vella.rs) and the transcription socket's query observer (vella_asr.rs).
block2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Emergency mode's tests drive the real cover-agent CLI against the real scoped server (a normal dependency too).
axum = "0.8"
libloading = "0.8"

[[bin]]
name = "speech-split-replay"
path = "src/speech-split-replay.rs"
test = false

[[bin]]
# Lab only, never bundled: the Goals shadow replayed on a recorded day (src/bin/goals-lab.rs, docs/goals.md).
name = "goals-lab"
path = "src/bin/goals-lab.rs"
test = false

[lints.rust]
# Friends (iroh) is not part of this source release; its cfg(feature = "friends") blocks compile out.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("friends"))'] }
