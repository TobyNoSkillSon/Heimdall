[package]
name = "heimdall-eval"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "heimdall-eval"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
listen = { path = "../listen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
decide = { path = "../decide" }
screen = { path = "../screen", features = ["listen-adapter"] }
hound = "3.5"
png = "0.18"
