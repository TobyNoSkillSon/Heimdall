[package]
name = "speak"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = "=2.0.0-rc.13"
ndarray = "0.17"
rand = "0.8"
rand_distr = "0.4"
unicode-normalization = "0.1"
regex = "1"
hound = "3.5"
cpal = "0.17"
half = "2"
# Phonon S (gradium/phonon-31m-en) runtime. Pinned; `hf` = JSON tokenizer only. No `hub`: it never downloads.
ptts = { git = "https://github.com/gradium-ai/xn-ptts", rev = "49b9033e44ab0fbb935973eca3213757644d1bbb", default-features = false, features = ["hf"] }
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.32"
objc = "0.2"

[dev-dependencies]
tempfile = "3"
