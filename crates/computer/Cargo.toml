[package]
name = "heimdall-computer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The agent's computer tool: acts on other apps through the Accessibility API (bug note 2026-10-22T19-16-01)."

[dependencies]
anyhow = "1"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }

[[bin]]
name = "heimdall-computer-probe"
path = "src/bin/probe.rs"
