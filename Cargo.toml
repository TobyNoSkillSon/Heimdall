[workspace]
resolver = "2"
members = ["crates/*"]
# Standalone (own [workspace]): the Rust Drama engine builds MLX bindings and never joins workspace builds.
exclude = ["crates/drama-engine"]

[workspace.package]
edition = "2021"
version = "0.1.0-alpha.2"
license = "Apache-2.0"

[workspace.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-av-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1

# Tests only (cargo test / nextest); release builds are untouched. Debug assertions and
# overflow checks stay on. Unoptimized model and DSP code made the model tests 5-10x slower.
[profile.test]
opt-level = 1
# No debug info (cleanup 14 Nov). Panic messages keep their file and line (compiled in); backtraces keep function
# names but lose line numbers, which no test reads. With line tables, macOS kept every test binary's object files in
# target/test/debug/deps (217,564 files on 13 Nov), and every test that first draws text had CoreText list that folder:
# a menu-caption test took 1.5-3 s instead of 0.06 s. Before: line tables only, which had cut the cold test build from
# 1131 s to 746 s at two jobs (lab/build-speed, 1 Nov).
debug = false
